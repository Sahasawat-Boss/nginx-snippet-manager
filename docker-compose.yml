services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_PATH: /data/snippets.db
      PORT: "3000"
    volumes:
      - snippet-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:80"

volumes:
  snippet-data:
