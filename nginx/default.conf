# This file is included inside the http {} block of the stock nginx.conf.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

log_format api_log '$remote_addr "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time';

upstream api_backend {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Locations below must not use add_header, or these would stop being inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        access_log /dev/stdout api_log;

        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_too_large;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"api_unavailable","message":"ระบบ API ไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้ง"}}';
    }

    location @api_rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"ส่งคำขอถี่เกินไป กรุณารอสักครู่"}}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"ข้อมูลมีขนาดใหญ่เกินไป"}}';
    }

    # Vite puts content-hashed files here, so they can be cached for a long time.
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: deep links such as /snippets/12 are resolved by React.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
